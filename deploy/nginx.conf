# bruceonyango.link — FPL XI dashboard (frontend) + API.
# Paste these locations inside your existing `server { … }` block for bruceonyango.link
# (the one that already handles TLS). Then: sudo nginx -t && sudo systemctl reload nginx

# ---- Frontend: https://bruceonyango.link/fantasy-league/ -----------------------------
# Built files (frontend/dist/*) live in /var/www/fantasy-league/.

location = /fantasy-league {
    return 301 /fantasy-league/;
}

# Hashed build assets never change → cache for a year.
location /fantasy-league/assets/ {
    alias /var/www/fantasy-league/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /fantasy-league/ {
    alias /var/www/fantasy-league/;
    # Client-side routes (/fantasy-league/players, …) all serve index.html.
    try_files $uri $uri/ /fantasy-league/index.html;
    # index.html must be revalidated so new deploys are picked up immediately.
    add_header Cache-Control "no-cache";
}

# ---- API: https://bruceonyango.link/fpl/... -----------------------------------------
# One entry point. No URI on proxy_pass, so the /fpl prefix is passed through untouched —
# the FastAPI app serves its routes under /fpl itself (FPL_API_PREFIX).

location /fpl/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # First request after a cache expiry calls the FPL API; give it room.
    proxy_read_timeout 60s;
}
