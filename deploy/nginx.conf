# TEMPLATE — example.com is a placeholder. Copy to deploy/nginx.local.conf (gitignored),
# put your real domain there, and paste that copy into your server config.
# example.com — reverse proxy for the two PM2 apps (see ../ecosystem.config.js).
#
#   https://example.com/fantasy-league/  →  fpl-web  127.0.0.1:3011
#   https://example.com/fpl/             →  fpl-api  127.0.0.1:8011
#
# Paste inside your existing `server { … }` block for example.com (the one with TLS),
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Both upstreams serve their own path prefix (/fantasy-league/, /fpl), so proxy_pass has
# no URI part and nothing is rewritten. Same origin for the browser → no CORS needed.

location = /fantasy-league {
    return 301 /fantasy-league/;
}

location /fantasy-league/ {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # fpl-web sets Cache-Control itself (immutable assets, no-cache index.html).
}

location /fpl/ {
    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A cache miss calls the FPL API; give it room.
    proxy_read_timeout 60s;
    # Note: fpl-api is one process, so `pm2 reload` leaves a ~1s gap (measured: 1 of 102
    # requests failed). The frontend's query retries absorb it; see docs/deployment-audit.md.
}
