# TEMPLATE — example.com is a placeholder. Copy to deploy/apache.local.conf (gitignored),
# put your real domain there, and paste that copy into your server config.
# example.com — reverse proxy for the two PM2 apps, Apache 2.4 version.
#
#   https://example.com/fantasy-league/  →  fpl-web  127.0.0.1:3011
#   https://example.com/fpl/             →  fpl-api  127.0.0.1:8011
#
# Paste inside your existing <VirtualHost *:443> for example.com.
# Needs: sudo a2enmod proxy proxy_http headers && sudo apachectl configtest && sudo systemctl reload apache2
# Both upstreams serve their own path prefix, so paths pass through unchanged.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

RedirectMatch 301 ^/fantasy-league$ /fantasy-league/
ProxyPass        /fantasy-league/ http://127.0.0.1:3011/fantasy-league/
ProxyPassReverse /fantasy-league/ http://127.0.0.1:3011/fantasy-league/

ProxyPass        /fpl/ http://127.0.0.1:8011/fpl/ timeout=60
ProxyPassReverse /fpl/ http://127.0.0.1:8011/fpl/
