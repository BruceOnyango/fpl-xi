# bruceonyango.link — FPL XI dashboard (frontend) + API, Apache 2.4 version.
# Paste inside your existing <VirtualHost *:443> for bruceonyango.link.
# Needs: sudo a2enmod proxy proxy_http headers  &&  sudo apachectl configtest && sudo systemctl reload apache2

# ---- Frontend: https://bruceonyango.link/fantasy-league/ -----------------------------
# Built files (frontend/dist/*) live in /var/www/fantasy-league/.

RedirectMatch 301 ^/fantasy-league$ /fantasy-league/
Alias /fantasy-league /var/www/fantasy-league

<Directory /var/www/fantasy-league>
    Options -Indexes
    AllowOverride None
    Require all granted
    # Client-side routes (/fantasy-league/players, …) all serve index.html.
    FallbackResource /fantasy-league/index.html
    # index.html must be revalidated so new deploys are picked up immediately.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>

# Hashed build assets never change → cache for a year.
<Directory /var/www/fantasy-league/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# ---- API: https://bruceonyango.link/fpl/... -----------------------------------------
# One entry point; the prefix is passed through untouched (the app serves /fpl itself).

ProxyPreserveHost On
ProxyPass        /fpl/ http://127.0.0.1:8000/fpl/ timeout=60
ProxyPassReverse /fpl/ http://127.0.0.1:8000/fpl/
RequestHeader set X-Forwarded-Proto "https"
